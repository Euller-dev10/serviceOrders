[uwsgi]
chdir           = /app
module          = app.wsgi:application
master          = true
processes       = ${UWSGI_PROCESSES}
threads         = 2
socket          = 0.0.0.0:8000
vacuum          = true
die-on-term     = true
max-requests    = 5000
harakiri        = 60
buffer-size      = 8192
lazy-apps       = true
enable-threads  = true
